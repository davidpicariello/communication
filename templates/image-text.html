<!--
name: Image with text
description: Pair a locally stored image with a heading and supporting text.
fields:
  - name: title
    label: Slide title
    type: heading
    required: true
  - name: image
    label: Local image path
    type: image
    required: true
  - name: alt
    label: Image description for accessibility
    type: text
    required: true
  - name: content
    label: Supporting content
    type: text
    required: true
-->
<div class="content-slide">
  <h2 data-fit>{{title}}</h2>
  <div class="image-text">
    <img src="{{image}}" alt="{{alt}}">
    <p data-fit>{{content}}</p>
  </div>
</div>
