<!--
name: Key statistic
description: Make one important number or short phrase the visual focus.
fields:
  - name: value
    label: Statistic or key phrase
    type: heading
    required: true
  - name: description
    label: What it represents
    type: text
    required: true
  - name: source
    label: Source or date
    type: text
    required: false
-->
<div class="statistic-slide">
  <p class="statistic-value" data-fit data-max-size="88">{{value}}</p>
  <p class="statistic-description" data-fit>{{description}}</p>
  <p class="attribution">{{source}}</p>
</div>
