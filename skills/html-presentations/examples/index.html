<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation Examples</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:32px; color:#18202e; background:#edf0f6; font-family:system-ui,sans-serif; overflow:auto; }
    main { width:max-content; margin:0 auto; }
    h1 { margin:0 0 8px; font-size:36px; }
    .intro { margin:0 0 24px; color:#657187; }
    .title-variant-grid { display:grid; grid-template-columns:repeat(4, 320px); gap:16px; }
    .title-variant-card { width:320px; padding:16px; border-radius:14px; background:#fff; box-shadow:0 8px 30px #17203312; }
    .title-variant-card h2 { margin:0 0 12px; font-size:20px; }
    .title-variant-preview { position:relative; width:288px; overflow:hidden; outline:1px solid #dce2ed; background:#101522; }
    .title-variant-preview iframe { position:absolute; top:0; left:0; display:block; border:0; transform-origin:top left; }
    .title-variant-card a { display:inline-block; margin-top:12px; color:#4a62d8; font-weight:650; }
    @media (max-width:1400px) { .title-variant-grid { grid-template-columns:repeat(2, 320px); } }
    @media (max-width:720px) { body { padding:16px; } main { margin:0; } .title-variant-grid { grid-template-columns:320px; } }
  </style>
</head>
<body>
  <main>
    <h1>Presentation Examples</h1>
    <p class="intro">Choose a size and theme to preview its title slide or show all slides.</p>
    <div class="title-variant-grid"><article class="title-variant-card">
  <h3>Standard · Dark</h3>
  <div class="title-variant-preview" style="height:216px">
    <iframe src="standard-dark/title.html" title="Standard · Dark title slide" width="1280" height="960" loading="lazy" style="width:1280px;height:960px;transform:scale(0.225000)"></iframe>
  </div>
  <a href="standard-dark/index.html">Show all slides</a>
</article><article class="title-variant-card">
  <h3>Standard · Light</h3>
  <div class="title-variant-preview" style="height:216px">
    <iframe src="standard-light/title.html" title="Standard · Light title slide" width="1280" height="960" loading="lazy" style="width:1280px;height:960px;transform:scale(0.225000)"></iframe>
  </div>
  <a href="standard-light/index.html">Show all slides</a>
</article><article class="title-variant-card">
  <h3>Widescreen · Dark</h3>
  <div class="title-variant-preview" style="height:162px">
    <iframe src="widescreen-dark/title.html" title="Widescreen · Dark title slide" width="1280" height="720" loading="lazy" style="width:1280px;height:720px;transform:scale(0.225000)"></iframe>
  </div>
  <a href="widescreen-dark/index.html">Show all slides</a>
</article><article class="title-variant-card">
  <h3>Widescreen · Light</h3>
  <div class="title-variant-preview" style="height:162px">
    <iframe src="widescreen-light/title.html" title="Widescreen · Light title slide" width="1280" height="720" loading="lazy" style="width:1280px;height:720px;transform:scale(0.225000)"></iframe>
  </div>
  <a href="widescreen-light/index.html">Show all slides</a>
</article></div>
  </main>
</body>
</html>
