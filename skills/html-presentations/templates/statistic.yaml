name: Key statistic
description: Make one important number or short phrase the visual focus.
fields:
  - name: value
    label: Statistic or key phrase
    type: heading
    required: true
    example: 30 km/h
    max_chars: 36
  - name: description
    label: What it represents
    type: text
    required: true
    example: A calmer speed for many neighborhood streets.
    max_chars: 825
  - name: source
    label: Source or date
    type: text
    required: false
    example: Illustrative target
    max_chars: 900
  - name: footer
    label: Footer text
    type: text
    required: false
    example: Department of Public Safety and Awareness and Concern
    max_chars: 160
body: |
  <div class="statistic-slide">
    <p class="statistic-value">{{value}}</p>
    <p class="statistic-description">{{description}}</p>
    <p class="attribution">{{source}}</p>
  </div>
  <footer class="slide-footer">{{footer}}</footer>
